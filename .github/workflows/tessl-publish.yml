name: Tessl Publish

# Publishes metcalf-solutions1/satori to the Tessl Registry whenever a GitHub
# Release is published or manually triggered via workflow_dispatch.
# Authenticates using TESSL_TOKEN stored in repository secrets.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Tessl CLI
        uses: tesslio/setup-tessl@25ec223fc0da33b41b8044ff5ab2b85235f4f91e # v2
        with:
          token: ${{ secrets.TESSL_TOKEN }}

      - name: Lint Tessl plugin manifest
        run: tessl plugin lint

      - name: Publish plugin to Tessl Registry
        run: tessl plugin publish --resolve-symlinks
