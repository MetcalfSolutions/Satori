<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found · Satori</title>
  <style>
    :root {
      --bg: #0c0e16;
      --bg2: #131622;
      --border: #25283a;
      --text: #f0eef8;
      --muted: #9594a8;
      --accent: #a594fd;
      --accent-btn: #6c5ce7;
      --accent-hover: #5848d4;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #faf8f5;
        --bg2: #ffffff;
        --border: #e2ddd5;
        --text: #181820;
        --muted: #626070;
        --accent: #5138e5;
        --accent-btn: #5138e5;
        --accent-hover: #3e26cb;
      }
    }
    * { box-sizing: border-box; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .not-found-card {
      max-width: 540px;
      padding: 48px 32px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
    }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 2.2rem;
      margin-top: 0;
      margin-bottom: 16px;
      color: var(--accent);
    }
    p {
      font-size: 1.05rem;
      line-height: 1.6;
      color: var(--muted);
      margin-bottom: 28px;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 24px;
      background: var(--accent-btn);
      color: #ffffff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      margin-bottom: 20px;
      transition: background 0.15s ease;
    }
    .btn-home:hover {
      background: var(--accent-hover);
    }
    .nav-links {
      display: flex;
      gap: 16px;
      justify-content: center;
      font-size: 0.95rem;
      flex-wrap: wrap;
    }
    .nav-links a {
      color: var(--accent);
      text-decoration: none;
    }
    .nav-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="not-found-card">
    <h1>404 · Path Not Found</h1>
    <p>In contemplation as in life, wandering off the path is part of finding clarity. The page you are looking for does not exist or has moved.</p>
    <a href="https://metcalfsolutions.github.io/Satori/" class="btn-home">Return to Satori Home</a>
    <div class="nav-links">
      <a href="https://metcalfsolutions.github.io/Satori/#install">Installation</a>
      <a href="https://github.com/MetcalfSolutions/Satori">GitHub Repository</a>
      <a href="https://metcalfsolutions.github.io/Satori/#crisis-resources">Crisis Resources</a>
    </div>
  </div>
</body>
</html>
